name: keepalive
# Pings the API every 3 days so the free Supabase project never pauses
# and the free Render service gets a wake-up. Add repo secret API_URL, e.g. https://your-api.onrender.com
on:
  schedule: [{ cron: '0 3 */3 * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "${{ secrets.API_URL }}/api/health"
